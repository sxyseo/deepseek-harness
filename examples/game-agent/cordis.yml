# One-shot game-engineering agent: the game runtime registry, the Godot
# backend, and the model-facing game tools over a minimal coding-agent core.
# The Godot row reads the same environment seam the test fixture sets, so the
# same composition runs against a real engine install or an engine shim.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Managed child-process groups for the Godot backend's CLI spawns.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# The game runtime registry: engine resolution and tracked live processes.
- id: game-runtime
  name: '@deepseek-ai/dsh-game-runtime'
  config:
    defaultEngine: godot

# The Godot backend. DSH_GODOT_EXECUTABLE / DSH_GODOT_PREFIX (comma-separated
# wrapper argv, e.g. "run,org.godotengine.Godot" for flatpak) override the
# defaults; the test fixture points both at a Node-run engine shim.
- id: game-runtime-godot
  name: '@deepseek-ai/dsh-game-runtime-godot'
  config:
    godotExecutable: !!js process.env.DSH_GODOT_EXECUTABLE ?? 'godot'
    argvPrefix: !!js "process.env.DSH_GODOT_PREFIX ? process.env.DSH_GODOT_PREFIX.split(',') : []"

# The model-facing game tools: build/run/read-log plus the M2 refactor
# queries (game_query_scene / game_query_asset).
- id: tool-game
  name: '@deepseek-ai/dsh-tool-game'

# Filesystem rows for the refactor loop: the agent inspects scenes and assets
# with the game query tools, then reads and edits .tscn/scripts with these.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Durable attachment store: game_capture_frame writes a PNG, and read_image
# (registered by tool-fs while this is mounted) surfaces it to the model.
- id: attachment
  name: '@deepseek-ai/dsh-attachment-local'

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext: false
    persona: |
      You are game-agent, a game engineering assistant powered by the {{model}} model.

      Build engine projects with game_build, start them with game_run, read their
      engine log with game_read_log, and inspect scenes and assets with
      game_query_scene / game_query_asset before editing .tscn or script files
      with the filesystem tools. Keep answers brief and factual.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
